mappings:
  # -------------------------
  # Airflow core metrics
  # -------------------------
  - match: "airflow.dagbag.size"
    name: "airflow_dagbag_size"
    help: "Number of DAGs loaded"

  - match: "airflow.scheduler.heartbeat"
    name: "airflow_scheduler_heartbeat"
    help: "Scheduler heartbeat"

  - match: "airflow.scheduler.tasks.running"
    name: "airflow_scheduler_tasks_running"

  - match: "airflow.scheduler.tasks.starving"
    name: "airflow_scheduler_tasks_starving"

  # -------------------------
  # Task instance metrics
  # airflow.task.<dag>.<task>.<state>
  # -------------------------
  - match: "airflow.task.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.task.*.*.success"
    name: "airflow_task_success_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.task.*.*.failed"
    name: "airflow_task_failed_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  # -------------------------
  # DAG run metrics
  # airflow.dag.<dag>.<state>
  # -------------------------
  - match: "airflow.dag.*.success"
    name: "airflow_dag_success_total"
    labels:
      dag_id: "$1"

  - match: "airflow.dag.*.failed"
    name: "airflow_dag_failed_total"
    labels:
      dag_id: "$1"
