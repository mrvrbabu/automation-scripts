global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ----------------------------------
  # Prometheus self-metrics
  # ----------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ----------------------------------
  # StatsD Exporter (Airflow metrics)
  # ----------------------------------
  - job_name: "statsd-exporter"
    static_configs:
      - targets: ["statsd-exporter:9102"]

  # ----------------------------------
  # Airflow Webserver (health + basic metrics)
  # ----------------------------------
  - job_name: "airflow-webserver"
    metrics_path: /health
    static_configs:
      - targets: ["airflow-webserver:8080"]
